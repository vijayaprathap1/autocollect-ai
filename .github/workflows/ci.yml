name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: autocollect
          POSTGRES_PASSWORD: autocollect_dev
          POSTGRES_DB: autocollect
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U autocollect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://autocollect:autocollect_dev@localhost:5433/autocollect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate + bootstrap roles
        run: |
          npm run db:migrate
          npm run db:roles

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Runs as the least-privilege roles so Row-Level Security is really enforced.
      - name: Unit + integration tests
        run: npm test
        env:
          DATABASE_URL: postgres://autocollect_app:autocollect_app_dev@localhost:5433/autocollect
          SERVICE_DATABASE_URL: postgres://autocollect_service:autocollect_service_dev@localhost:5433/autocollect
          MIGRATION_DATABASE_URL: postgres://autocollect:autocollect_dev@localhost:5433/autocollect

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t autocollect-ai --build-arg APP_VERSION=${{ github.sha }} .
