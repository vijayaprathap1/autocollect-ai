name: Scheduled jobs

# The reminder worker lives in the app (`npm run worker`, or the API process
# when RUN_SCHEDULER=true). It leases jobs in Postgres, so this workflow is no
# longer required. workflow_dispatch remains as a manual backup for a serverless
# deploy that has no resident process: set CRON_URL and CRON_SECRET, then run
# the workflow by hand.
on:
  workflow_dispatch:

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  dunning:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET are not configured; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 \
            -H "x-cron-secret: $CRON_SECRET" "$CRON_URL"
