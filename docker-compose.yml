# Local development database (Postgres 17 on port 5433, same major version as CI).
#
#   docker compose up -d                 # database only (use `npm run dev` for the app)
#   docker compose --profile app up -d   # database + the production image on http://localhost:4000
services:
  postgres:
    image: postgres:17-alpine
    container_name: autocollect-pg
    environment:
      POSTGRES_USER: autocollect
      POSTGRES_PASSWORD: autocollect_dev
      POSTGRES_DB: autocollect
    ports:
      - "5433:5432"
    volumes:
      - autocollect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocollect -d autocollect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the production image locally in development mode (mocks enabled).
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://autocollect:autocollect_dev@postgres:5432/autocollect
      WEB_ORIGIN: http://localhost:4000
      APP_URL: http://localhost:4000/api
    ports:
      - "4000:4000"
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/server.js"]

volumes:
  autocollect_pgdata:
